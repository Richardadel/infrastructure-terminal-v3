    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101A16"/><stop offset="1" stop-color="#0B1110"/></linearGradient>
  </defs>
  <rect width="1440" height="620" rx="18" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <rect x="24" y="24" width="1392" height="572" rx="12" fill="url(#grid)" opacity=".9"/>

  <g font-family="ui-monospace, monospace" fill="#8FA99B" font-size="11" letter-spacing="2">
