<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise infrastructure control plane</title>
  <desc id="desc">A five-layer conceptual architecture connecting identity, endpoint management, cloud productivity, physical infrastructure, and operations.</desc>
  <defs>
