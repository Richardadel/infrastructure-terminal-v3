    <rect x="498" y="146" width="180" height="46" rx="8"/>
    <rect x="102" y="238" width="180" height="46" rx="8"/><rect x="300" y="238" width="180" height="46" rx="8"/><rect x="498" y="238" width="180" height="46" rx="8"/>
    <rect x="102" y="330" width="180" height="46" rx="8"/><rect x="300" y="330" width="180" height="46" rx="8"/><rect x="498" y="330" width="180" height="46" rx="8"/>
    <rect x="102" y="422" width="180" height="46" rx="8"/><rect x="300" y="422" width="180" height="46" rx="8"/><rect x="498" y="422" width="180" height="46" rx="8"/>
    <rect x="102" y="514" width="180" height="46" rx="8"/><rect x="300" y="514" width="180" height="46" rx="8"/><rect x="498" y="514" width="180" height="46" rx="8"/>
