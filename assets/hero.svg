<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Richard Fathalla — IT Infrastructure and Systems Engineering</title>
  <desc id="desc">A black and neon-green infrastructure engineering profile hero.</desc>
  <defs>
