    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#102119" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="600" rx="18" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="12" fill="url(#grid)" stroke="#1C3B2D" stroke-width="2"/>
  <g fill="#050807" stroke="#1C3B2D"><circle cx="50" cy="50" r="6" stroke="none" fill="#FF5F56"/><circle cx="70" cy="50" r="6" stroke="none" fill="#FFBD2E"/><circle cx="90" cy="50" r="6" stroke="none" fill="#27C93F"/></g>
