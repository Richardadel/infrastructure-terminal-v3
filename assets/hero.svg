<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Richard Fathalla — IT Infrastructure, Systems Engineering, and Cloud Technologies</title>
  <desc id="desc">Terminal-inspired engineering hero with a neon-green connected infrastructure topology and a blinking command cursor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050807"/><stop offset="1" stop-color="#0B1110"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00FF88" stop-opacity="0"/><stop offset=".5" stop-color="#00FF88" stop-opacity=".85"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lighting">
      <stop stop-color="#00FF88" stop-opacity=".14"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00FF88" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1440" height="560" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1438" height="558" rx="19" fill="none" stroke="#1C3B2D" stroke-width="2"/>
  <rect x="22" y="22" width="1396" height="516" rx="14" fill="url(#grid)"/>
  <circle cx="1170" cy="292" r="260" fill="url(#lighting)"/>

  <circle cx="48" cy="48" r="6" fill="#FF5F56"/><circle cx="68" cy="48" r="6" fill="#FFBD2E"/><circle cx="88" cy="48" r="6" fill="#27C93F"/>
  <line x1="22" y1="72" x2="1418" y2="72" stroke="#1C3B2D"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="142" fill="#8AFFC1" font-size="24" letter-spacing="4">&gt; SYSTEM.IDENTITY</text>
    <text x="72" y="226" fill="#F2FFF8" font-size="62" font-weight="800" letter-spacing="1">RICHARD FATHALLA</text>
    <text x="72" y="270" fill="#00FF88" font-size="32" font-weight="700" letter-spacing="1">IT INFRASTRUCTURE / SYSTEMS</text>
    <text x="72" y="310" fill="#00FF88" font-size="32" font-weight="700" letter-spacing="1">ENGINEERING / CLOUD TECHNOLOGIES</text>
    <text x="72" y="362" fill="#A9BFB3" font-size="22">richard_fathalla@engineering:~$</text>
    <rect x="380" y="341" width="12" height="28" fill="#00FF88">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="none" stroke="#00FF88" stroke-width="2" opacity=".76">
    <path d="M850 360C920 278 1008 278 1080 360S1220 442 1320 350"/>
    <path d="M850 360H1000V246H1132V156H1320"/>
    <path d="M1000 246H1080V360"/>
    <path d="M1132 156V246"/>
    <path d="M1000 246V420H1320"/>
  </g>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2">
    <rect x="836" y="330" width="156" height="64" rx="10"/>
    <rect x="922" y="214" width="156" height="64" rx="10"/>
    <rect x="1054" y="124" width="156" height="64" rx="10"/>
    <rect x="1242" y="124" width="156" height="64" rx="10"/>
    <rect x="1242" y="388" width="156" height="64" rx="10"/>
  </g>
  <g fill="#050807" stroke="#00FF88" stroke-width="2">
    <circle cx="850" cy="360" r="8"/><circle cx="922" cy="246" r="8"/><circle cx="1054" cy="156" r="8"/>
    <circle cx="1242" cy="156" r="8"/><circle cx="1242" cy="420" r="8"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#8AFFC1" font-size="21">
    <text x="914" y="367">OPERATIONS</text><text x="1000" y="253">IDENTITY</text>
    <text x="1132" y="163">ENDPOINT</text><text x="1320" y="163">CLOUD</text><text x="1320" y="427">NETWORK</text>
  </g>
  <line x1="72" y1="488" x2="1368" y2="488" stroke="url(#beam)" stroke-width="2"/>
</svg>
