<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title">
  <title id="title">Endpoint lifecycle workflow</title>
  <rect width="1440" height="360" rx="18" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <g stroke="#00FF88" stroke-width="2" opacity=".8"><line x1="150" y1="180" x2="1290" y2="180"/></g>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2">
    <rect x="74" y="100" width="152" height="160" rx="12"/><rect x="344" y="100" width="152" height="160" rx="12"/><rect x="614" y="100" width="152" height="160" rx="12"/><rect x="884" y="100" width="152" height="160" rx="12"/><rect x="1214" y="100" width="152" height="160" rx="12"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="150" y="136" fill="#00FF88" font-size="24" letter-spacing="1">01 PROVISION</text><text x="150" y="168" fill="#F2FFF8" font-size="22">DEVICE PREP</text><text x="150" y="208" fill="#A9BFB3" font-size="20">WINDOWS / macOS</text>
    <text x="420" y="136" fill="#00FF88" font-size="24" letter-spacing="1">02 ENROLL</text><text x="420" y="168" fill="#F2FFF8" font-size="22">AUTOPILOT / INTUNE</text><text x="420" y="208" fill="#A9BFB3" font-size="20">ADDIGY</text>
    <text x="690" y="136" fill="#00FF88" font-size="24" letter-spacing="1">03 CONFIGURE</text><text x="690" y="168" fill="#F2FFF8" font-size="22">PROFILES / ACCESS</text><text x="690" y="208" fill="#A9BFB3" font-size="20">DOMAIN JOIN</text>
    <text x="960" y="136" fill="#00FF88" font-size="24" letter-spacing="1">04 MANAGE</text><text x="960" y="168" fill="#F2FFF8" font-size="22">SUPPORT / UPDATES</text><text x="960" y="208" fill="#A9BFB3" font-size="20">LIFECYCLE</text>
    <text x="1290" y="136" fill="#00FF88" font-size="24" letter-spacing="1">05 RETIRE</text><text x="1290" y="168" fill="#F2FFF8" font-size="22">REPLACE / ASSET</text><text x="1290" y="208" fill="#A9BFB3" font-size="20">DECOMMISSION</text>
  </g>
</svg>
