<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1160" viewBox="0 0 800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Verified GitHub projects</title>
  <desc id="desc">Three verified projects: a PHP and MySQL gym application, a yoga relational database, and a cybersecurity incident dataset.</desc>
  <rect width="800" height="1160" rx="18" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2">
    <rect x="40" y="40" width="720" height="340" rx="16"/><rect x="40" y="400" width="720" height="340" rx="16"/><rect x="40" y="760" width="720" height="360" rx="16"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#F2FFF8">
    <g fill="#00FF88" font-size="22" letter-spacing="2"><text x="72" y="82">PROJECT 01 // PHP / MYSQL</text><text x="72" y="442">PROJECT 02 // RELATIONAL DATABASE</text><text x="72" y="802">PROJECT 03 // DATA ANALYSIS</text></g>
    <g font-size="32" font-weight="700"><text x="72" y="128">GYM MANAGEMENT SYSTEM</text><text x="72" y="488">YOGA STUDIO DATABASE</text><text x="72" y="848">CYBERSECURITY THREAT DATA</text></g>
    <g font-size="22"><text x="72" y="178">PHP authentication and session handling</text><text x="72" y="538">Members, instructors, classes, schedules, rooms</text><text x="72" y="898">Structured incident CSV covering 2015–2024</text></g>
  </g>
  <g fill="#050807" stroke="#00FF88" stroke-width="1.5">
    <rect x="72" y="220" width="198" height="120" rx="10"/><rect x="301" y="220" width="198" height="120" rx="10"/><rect x="530" y="220" width="198" height="120" rx="10"/>
    <rect x="72" y="580" width="198" height="120" rx="10"/><rect x="301" y="580" width="198" height="120" rx="10"/><rect x="530" y="580" width="198" height="120" rx="10"/>
    <rect x="72" y="940" width="198" height="120" rx="10"/><rect x="301" y="940" width="198" height="120" rx="10"/><rect x="530" y="940" width="198" height="120" rx="10"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#8AFFC1" font-size="24">
    <text x="171" y="276">AUTH / SESSION</text><text x="400" y="276">MEMBERS / TRAINERS</text><text x="629" y="276">CLASSES / MYSQL</text>
    <text x="171" y="636">MEMBERS</text><text x="400" y="636">INSTRUCTORS / CLASSES</text><text x="629" y="636">SCHEDULE / ROOMS</text>
    <text x="171" y="996">CSV SOURCE</text><text x="400" y="996">INCIDENT FIELDS</text><text x="629" y="996">DATA EXPLORATION</text>
  </g>
