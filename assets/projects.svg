<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1060" viewBox="0 0 800 1060" role="img" aria-labelledby="title desc">
  <title id="title">Verified GitHub projects</title>
  <desc id="desc">Three verified projects: a PHP and MySQL gym application, a yoga relational database, and a cybersecurity incident dataset.</desc>
  <style>@media (prefers-reduced-motion: reduce) {.motion { display: none; }}</style>
  <rect width="800" height="1060" rx="18" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2">
    <rect x="40" y="40" width="720" height="310" rx="16"/><rect x="40" y="380" width="720" height="310" rx="16"/><rect x="40" y="720" width="720" height="310" rx="16"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#F2FFF8">
    <g fill="#00FF88" font-size="22" letter-spacing="2"><text x="72" y="82">PROJECT 01 // PHP / MYSQL</text><text x="72" y="422">PROJECT 02 // RELATIONAL DATABASE</text><text x="72" y="762">PROJECT 03 // DATA ANALYSIS</text></g>
    <g font-size="30" font-weight="700"><text x="72" y="128">GYM MANAGEMENT SYSTEM</text><text x="72" y="468">YOGA STUDIO DATABASE</text><text x="72" y="808">CYBERSECURITY THREAT DATA</text></g>
    <g font-size="21"><text x="72" y="178">PHP authentication and session handling</text><text x="72" y="518">Members, instructors, classes, schedules, rooms</text><text x="72" y="858">Structured incident CSV covering 2015–2024</text></g>
  </g>
  <g fill="#050807" stroke="#00FF88" stroke-width="1.5">
    <rect x="72" y="210" width="656" height="110" rx="10"/>
    <rect x="72" y="550" width="656" height="110" rx="10"/>
    <rect x="72" y="890" width="656" height="110" rx="10"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#8AFFC1" font-size="22">
    <text x="96" y="252">PHP / MYSQL / AUTHENTICATION / SESSIONS</text><text x="96" y="290">MEMBERS / TRAINERS / CLASSES / ENROLLMENTS</text>
    <text x="96" y="592">MYSQL / MICROSOFT ACCESS / RELATIONAL TABLES</text><text x="96" y="630">MEMBERS / INSTRUCTORS / CLASSES / SCHEDULE</text>
    <text x="96" y="932">CSV / COUNTRY / YEAR / ATTACK / INDUSTRY</text><text x="96" y="970">LOSS / USERS / VULNERABILITY / RESPONSE</text>
  </g>
  <path d="M560 310H700M560 650H700M700 910V980" fill="none" stroke="#1C3B2D" stroke-width="2"/>
  <circle class="motion" r="5" fill="#8AFFC1"><animateMotion dur="5.5s" repeatCount="indefinite" path="M560 310 H700"/></circle>
  <circle class="motion" r="5" fill="#8AFFC1"><animateMotion dur="7.5s" repeatCount="indefinite" path="M560 650 H700"/></circle>
  <circle class="motion" r="5" fill="#8AFFC1"><animateMotion dur="6.5s" repeatCount="indefinite" path="M700 910 V980"/></circle>
</svg>
